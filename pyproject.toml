[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse"
version = "0.1.0"
description = "Retail sales, customer, demand, and inventory analytics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1",
  "joblib>=1.3",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pyarrow>=15.0",
  "xlrd>=2.0",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
forecast = ["prophet>=1.1"]
mlops = ["mlflow>=2.12"]

[project.scripts]
retailpulse-train-demand = "retailpulse.demand_model:main"
retailpulse-train-churn = "retailpulse.churn_model:main"
retailpulse-etl = "retailpulse.etl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100